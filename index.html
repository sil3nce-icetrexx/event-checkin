<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top Lords Kingdom 4 Weekly Event Check In</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:#f7f8fa;
    color:#222;
    padding:20px;
}

.container{
    width:100%;
    max-width:600px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
    text-align:center;
}

h1{
    font-size:32px;
    line-height:1.3;
    margin-bottom:10px;
}

#weekDisplay{
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

label{
    display:block;
    text-align:left;
    margin-top:18px;
    margin-bottom:8px;
    font-size:13px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    font-size:16px;
    border:1px solid #dcdcdc;
    border-radius:12px;
    background:#fafafa;
}

input:focus{
    outline:none;
    border-color:#4285f4;
    background:white;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    font-size:16px;
    border:none;
    border-radius:12px;
    background:#4285f4;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#3367d6;
}

button:disabled{
    background:#9dbcf7;
    cursor:not-allowed;
}

#message{
    margin-top:20px;
    line-height:1.5;
    font-weight:bold;
}

.counter-box{
    margin-top:35px;
    padding:20px;
    border-radius:12px;
    background:#f5f7fb;
}

.counter-title{
    font-size:13px;
    line-height:1.5;
    margin-bottom:10px;
}

#signupCounter{
    font-size:42px;
    font-weight:bold;
    color:#4285f4;
}
</style>
</head>

<body>

<div class="container">

<h1>Top Lords Kingdom 4 Weekly Event Check In</h1>

<p id="weekDisplay"></p>

<label>
Name / 姓名 / नाम / Nombre / Nom / Name / الاسم / Имя
</label>
<input id="onlineName" type="text" maxlength="20" required>

<label>
Alliance / 聯盟 / गठबंधन / Alianza / Alliance / Allianz / التحالف / Альянс
</label>
<input id="alliance" type="text" maxlength="20" required>

<label>
Main Squad Power / 主力部隊戰力 / मुख्य दस्ते की शक्ति / Poder del Escuadrón Principal / Puissance de l'Escouade Principale / Stärke des Haupttrupps / قوة الفريق الرئيسي / Мощь основного отряда
</label>
<input id="squadPower" type="text" maxlength="20" required>

<button id="submitButton" onclick="submitCheckin()">
Submit Weekly Check In
</button>

<p id="message"></p>

<div class="counter-box">

<div class="counter-title">
Total Sign Ups This Week /
本週總報名人數 /
इस सप्ताह कुल पंजीकरण /
Total de Inscripciones Esta Semana /
Total des Inscriptions Cette Semaine /
Gesamtanmeldungen Diese Woche /
إجمالي المسجلين هذا الأسبوع /
Всего регистраций за эту неделю
</div>

<div id="signupCounter">0</div>

</div>

</div>

<script>
const SUPABASE_URL =
"https://akuiucyughszpnitzxju.supabase.co";

const SUPABASE_KEY =
"sb_publishable_O4I7qGJYGfRkyg4rPIUnOA_m4g-Sdcl";

/* Week number */
function getWeekNumber() {
    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 1);
    const diff = (now - start) / 86400000;
    return Math.ceil((diff + start.getDay() + 1) / 7);
}

/* Current event week display */
function getEventWeekStart() {
    const now = new Date();
    const sunday = new Date(now);

    sunday.setDate(now.getDate() - now.getDay());
    sunday.setHours(0,0,0,0);

    return sunday;
}

function displayCurrentWeek() {
    const weekStart = getEventWeekStart();

    document.getElementById("weekDisplay").textContent =
        "Current Event Week Started: " +
        weekStart.toLocaleDateString();
}

displayCurrentWeek();

/* Weekly signup counter */
async function loadWeeklyCount() {

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/checkins?week_num=eq.${getWeekNumber()}&select=id`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        const data = await response.json();

        document.getElementById("signupCounter").textContent =
            Array.isArray(data) ? data.length : 0;

    } catch (error) {
        console.error(error);
    }
}

loadWeeklyCount();

/* Submit check-in */
async function submitCheckin() {

    const onlineName =
        document.getElementById("onlineName").value.trim();

    const alliance =
        document.getElementById("alliance").value.trim();

    const squadPower =
        document.getElementById("squadPower").value.trim();

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("submitButton");

    if (!onlineName || !alliance || !squadPower) {

        message.style.color = "red";
        message.innerHTML =
            "❌ Please complete all fields.";

        return;
    }

    button.disabled = true;
    button.textContent = "Submitting...";

    try {

        const response = await fetch(
            `${SUPABASE_URL}/rest/v1/checkins`,
            {
                method: "POST",

                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                    "Content-Type": "application/json",
                    "Prefer": "return=representation"
                },

                body: JSON.stringify({
                    week_num: getWeekNumber(),

                    online_name: onlineName,

                    online_name_normalized:
                        onlineName.toLowerCase(),

                    alliance: alliance,

                    first_squad_power: squadPower
                })
            }
        );

        const result = await response.text();

        if (response.ok) {

            message.style.color = "green";

            message.innerHTML =
                `✅ Thank you <b>${onlineName}</b>.<br>Your weekly check-in has been recorded.`;

            document.getElementById("onlineName").value = "";
            document.getElementById("alliance").value = "";
            document.getElementById("squadPower").value = "";

            loadWeeklyCount();

        } else {

            if (
                result.toLowerCase().includes("duplicate") ||
                result.toLowerCase().includes("unique") ||
                result.includes("23505")
            ) {

                message.style.color = "#d98200";

                message.innerHTML =
                    `⚠️ <b>${onlineName}</b> has already checked in this week.`;

            } else {

                message.style.color = "red";

                message.innerHTML =
                    `❌ Submission failed.<br><small>${result}</small>`;
            }
        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.innerHTML =
            "❌ Connection error. Please try again.";
    }

    button.disabled = false;
    button.textContent = "Submit Weekly Check In";
}
</script>

</body>
</html>
